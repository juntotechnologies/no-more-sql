version: '3.3'

services:
  no-more-sql:
    build: .
    container_name: no-more-sql
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./code:/app/code
    environment:
      - STREAMLIT_SERVER_PORT=8504
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: always
    depends_on:
      - ollama-gpu0
      - ollama-gpu1
      - ollama-gpu2
      - ollama-gpu3
      - ollama-gpu4
      - ollama-gpu5

  ollama-gpu0:
    image: ollama/ollama:latest
    container_name: ollama-gpu0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_0:/root/.ollama
    restart: always

  ollama-gpu1:
    image: ollama/ollama:latest
    container_name: ollama-gpu1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data_1:/root/.ollama
    restart: always

  ollama-gpu2:
    image: ollama/ollama:latest
    container_name: ollama-gpu2
