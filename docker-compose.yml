      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "11437:11434"
    volumes:
      - ollama_data_3:/root/.ollama
    restart: always

  ollama-gpu4:
    image: ollama/ollama:latest
    container_name: ollama-gpu4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "11438:11434"
    volumes:
      - ollama_data_4:/root/.ollama
    restart: always

  ollama-gpu5:
    image: ollama/ollama:latest
    container_name: ollama-gpu5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "11439:11434"
    volumes:
      - ollama_data_5:/root/.ollama
    restart: always

volumes:
  ollama_data_0:
  ollama_data_1:
  ollama_data_2:
  ollama_data_3:
  ollama_data_4:
  ollama_data_5:
